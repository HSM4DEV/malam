<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Serif+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .snav a { text-decoration: none; }
  @media (max-width: 900px) { .snav-links { display: none !important; } .snav-cta-en { display: none !important; } }
</style>
</helmet>
<nav class="snav" dir="rtl" style="font-family:'IBM Plex Sans Arabic',sans-serif;position:sticky;top:0;z-index:80;background:rgba(246,243,236,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(23,24,26,.1)">
  <div style="max-width:1320px;margin:0 auto;padding:0 40px;height:74px;display:flex;align-items:center;justify-content:space-between">
    <a href="Homepage-Signature.dc.html" style="display:flex;align-items:center;gap:11px;color:#14453C">
      <svg width="22" height="26" viewBox="0 0 24 28" fill="none" style="display:block"><path d="M2 27 V11 A10 10 0 0 1 22 11 V27" stroke="currentColor" stroke-width="2"/><path d="M2 27 H22" stroke="currentColor" stroke-width="2"/></svg>
      <span style="display:flex;flex-direction:column;line-height:.9">
        <span style="font-family:'Noto Serif Arabic',serif;font-size:25px;font-weight:700;color:#17181A">مَعلم</span>
        <span style="font-size:8px;letter-spacing:4px;color:#14453C;font-weight:600;margin-top:3px;direction:ltr">MA'LAM</span>
      </span>
    </a>
    <div class="snav-links" style="display:flex;gap:32px">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
        <a href="{{ l.href }}" style="{{ l.style }}" style-hover="color:#14453C">{{ l.t }}</a>
      </sc-for>
    </div>
    <div style="display:flex;align-items:center;gap:18px">
      <a href="Auth.dc.html" class="snav-cta-en" style="font-size:13.5px;color:#46433C;font-weight:500" style-hover="color:#14453C">تسجيل الدخول</a>
      <button class="snav-cta-en" style="background:none;border:none;font-family:inherit;font-size:12px;letter-spacing:1.5px;color:#6E6A61;font-weight:600;cursor:pointer;direction:ltr">EN</button>
      <a href="Contact.dc.html" style="background:#14453C;color:#F6F3EC;padding:10px 20px;font-size:13.5px;font-weight:600;border-radius:10px" style-hover="background:#0E332C">احجز استشارة</a>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:74},&quot;active&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || '';
    const links = [
      { t: 'المساكن', href: 'Projects-Signature.dc.html', key: 'home' },
      { t: 'المطوّرون', href: 'Developers.dc.html', key: 'developers' },
      { t: 'الوسطاء', href: 'Brokers.dc.html', key: 'brokers' },
      { t: 'عن مَعلم', href: 'About.dc.html', key: 'about' },
      { t: 'المدوّنة', href: 'Blog.dc.html', key: 'blog' },
      { t: 'الأسئلة', href: 'FAQ.dc.html', key: 'faq' }
    ].map(l => ({ ...l, style: { color: l.key === active ? '#14453C' : '#46433C', fontWeight: l.key === active ? 600 : 500, fontSize: '14px' } }));
    return { links };
  }
}
</script>
</body>
</html>
